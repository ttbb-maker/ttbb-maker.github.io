<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ziele</title>
<meta name="theme-color" content="#0e0f11">
<meta name="description" content="Meine Ziele im Blick – Fortschritt tracken, ganz ohne Server.">
<link rel="manifest" href="ziele.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ziele">
<link rel="apple-touch-icon" href="ziele-icon.svg">
<link rel="icon" href="ziele-icon.svg">
<style>
  :root { --bg:#0e0f11;--surface:#16181c;--card:#1e2128;--border:#2a2d35;--accent:#d4f547;--accent2:#47b8f5;--text:#f0f0ed;--muted:#6b7080;--danger:#f54747;--ok:#47f57a;--radius:14px; }
  * { box-sizing:border-box;margin:0;padding:0; }
  body { background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom)) 0; }
  .header { padding:28px 20px 0; }
  .header-top { display:flex;justify-content:space-between;align-items:flex-start;gap:10px; }
  .header-label { font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:4px; }
  .header h1 { font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.1; }
  .header-meta { font-size:11px;color:var(--muted);margin-top:6px; }
  .btn-install { display:none;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0; }
  .stats { display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:20px 20px 0; }
  .stat-box { background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center; }
  .stat-value { font-size:20px;font-weight:700;color:var(--accent);line-height:1; }
  .stat-value.blue { color:var(--accent2); }
  .stat-value.green { color:var(--ok); }
  .stat-label { font-size:9px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.1em; }
  .form-card { margin:20px 20px 0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color .3s; }
  .form-card.edit-mode { border-color:var(--accent2); }
  .form-title { font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--accent);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px; }
  .form-title::before { content:'';display:block;width:8px;height:8px;background:var(--accent);border-radius:50%; }
  .form-card.edit-mode .form-title { color:var(--accent2); }
  .form-card.edit-mode .form-title::before { background:var(--accent2); }
  .field-row-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px; }
  .field { margin-bottom:10px; }
  label { display:block;font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:5px; }
  input,select,textarea { width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none; }
  input:focus,select:focus,textarea:focus { border-color:var(--accent); }
  input::placeholder,textarea::placeholder { color:var(--muted); }
  textarea { resize:vertical;min-height:44px; }
  .tags { display:flex;flex-wrap:wrap;gap:6px;margin-top:4px; }
  .tag { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted); }
  .tag.active { background:var(--accent);border-color:var(--accent);color:#0e0f11;font-weight:700; }
  .btn-add { width:100%;margin-top:14px;background:var(--accent);color:#0e0f11;border:none;border-radius:10px;padding:15px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer; }
  .btn-add:active { opacity:.8; }
  .btn-cancel { width:100%;margin-top:8px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;cursor:pointer; }
  .list-header { display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0;gap:8px; }
  .list-title { font-size:14px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.05em;flex:1; }
  .filter-bar { display:flex;gap:6px;padding:12px 20px 0;overflow-x:auto;-webkit-overflow-scrolling:touch; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .filter-chip { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap;flex-shrink:0; }
  .filter-chip.active { background:var(--accent2);border-color:var(--accent2);color:#0e0f11;font-weight:700; }
  .data-bar { display:flex;gap:8px;padding:12px 20px 0;justify-content:flex-end; }
  .btn-data { background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-family:inherit;font-size:11px;cursor:pointer; }
  .btn-data:hover { border-color:var(--accent);color:var(--accent); }
  .ziel-list { padding:12px 20px 0;display:flex;flex-direction:column;gap:10px; }
  .ziel-card { background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;transition:border-color .2s; }
  .ziel-card.done { border-color:var(--ok); }
  .ziel-top { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:10px; }
  .ziel-titel { font-size:16px;font-weight:700;color:var(--text);line-height:1.3;flex:1;padding-right:60px; }
  .ziel-kat { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:10px;color:var(--muted);white-space:nowrap;align-self:flex-start; }
  .ziel-notiz { font-size:12px;color:var(--muted);margin:2px 0 10px;line-height:1.4; }
  .progress-wrap { margin-top:10px; }
  .progress-info { display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px; }
  .progress-vals { font-size:13px;color:var(--text);font-weight:600; }
  .progress-pct { font-size:15px;font-weight:800;color:var(--accent); }
  .ziel-card.done .progress-pct { color:var(--ok); }
  .progress-bar { height:10px;background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--border); }
  .progress-fill { height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:8px;transition:width .4s ease;min-width:0; }
  .ziel-card.done .progress-fill { background:var(--ok); }
  .ziel-foot { display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px; }
  .ziel-deadline { font-size:11px;color:var(--muted); }
  .ziel-deadline.soon { color:var(--accent); }
  .ziel-deadline.over { color:var(--danger); }
  .quick-btns { display:flex;gap:6px; }
  .btn-quick { background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1; }
  .btn-quick:active { background:var(--accent);color:#0e0f11; }
  .btn-quick.minus:active { background:var(--danger);color:#fff; }
  .btn-delete,.btn-edit { position:absolute;top:12px;display:none;border:none;border-radius:6px;width:26px;height:26px;font-size:14px;cursor:pointer;align-items:center;justify-content:center; }
  .btn-delete { right:12px;background:var(--danger);color:white;font-size:16px; }
  .btn-edit { right:44px;background:var(--accent2);color:#0e0f11; }
  .ziel-card:hover .btn-delete,.ziel-card:active .btn-delete,
  .ziel-card:hover .btn-edit,.ziel-card:active .btn-edit { display:flex; }
  .done-badge { position:absolute;top:12px;right:12px;background:var(--ok);color:#0e0f11;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:800; }
  .ziel-card:hover .done-badge,.ziel-card:active .done-badge { display:none; }
  .empty-state { text-align:center;padding:40px 20px;color:var(--muted);font-size:13px; }
  .empty-icon { font-size:40px;margin-bottom:12px;opacity:.4; }
  .toast { position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#0e0f11;border-radius:30px;padding:10px 22px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap; }
  .toast.show { opacity:1;transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-label">Ziele-Dashboard</div>
      <h1>Meine Ziele</h1>
      <div class="header-meta" id="headerMeta">0 Ziele</div>
    </div>
    <button class="btn-install" id="btnInstall" onclick="installApp()">&#8595; App</button>
  </div>
</div>

<div class="stats">
  <div class="stat-box"><div class="stat-value blue" id="statAktiv">0</div><div class="stat-label">Aktiv</div></div>
  <div class="stat-box"><div class="stat-value green" id="statErreicht">0</div><div class="stat-label">Erreicht</div></div>
  <div class="stat-box"><div class="stat-value" id="statFortschritt">0%</div><div class="stat-label">&#216; Fortschritt</div></div>
</div>

<div class="form-card" id="formCard">
  <div class="form-title" id="formTitle">Ziel hinzuf&#252;gen</div>
  <div class="field">
    <label>Titel</label>
    <input type="text" id="titel" placeholder="z.B. 100 km laufen">
  </div>
  <div class="field">
    <label>Kategorie</label>
    <div class="tags" id="katTags">
      <div class="tag active" onclick="selectKat(this)">Sport</div>
      <div class="tag" onclick="selectKat(this)">Gesundheit</div>
      <div class="tag" onclick="selectKat(this)">Finanzen</div>
      <div class="tag" onclick="selectKat(this)">Lernen</div>
      <div class="tag" onclick="selectKat(this)">Beruf</div>
      <div class="tag" onclick="selectKat(this)">Sonstiges</div>
    </div>
    <input type="text" id="katCustom" placeholder="Oder eigene Kategorie ..." style="margin-top:8px;">
  </div>
  <div class="field-row-3">
    <div class="field">
      <label>Startwert</label>
      <input type="number" id="aktuell" placeholder="0" step="any">
    </div>
    <div class="field">
      <label>Zielwert</label>
      <input type="number" id="ziel" placeholder="100" step="any">
    </div>
    <div class="field">
      <label>Einheit</label>
      <input type="text" id="einheit" placeholder="km">
    </div>
  </div>
  <div class="field">
    <label>Frist (optional)</label>
    <input type="date" id="deadline">
  </div>
  <div class="field">
    <label>Notiz (optional)</label>
    <textarea id="notiz" placeholder="Warum ist dir dieses Ziel wichtig?"></textarea>
  </div>
  <button class="btn-add" id="btnAdd" onclick="addZiel()">+ Ziel hinzuf&#252;gen</button>
  <button class="btn-cancel" id="btnCancel" onclick="cancelEdit()" style="display:none;">Abbrechen</button>
</div>

<div class="list-header">
  <div class="list-title">Ziele</div>
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="data-bar">
  <button class="btn-data" onclick="exportJSON()">&#8593; Sichern</button>
  <label class="btn-data" style="cursor:pointer;">&#8595; Importieren<input type="file" accept=".json" onchange="importJSON(this)" style="display:none;"></label>
</div>

<div class="ziel-list" id="zielList">
  <div class="empty-state"><div class="empty-icon">&#127919;</div>Noch keine Ziele &#8211; leg dein erstes an!</div>
</div>

<div class="toast" id="toast"></div>

<script>
var ziele = [];
var editId = null;
var aktivFilter = 'alle';

function loadZiele() {
  try { ziele = JSON.parse(localStorage.getItem('ziele') || '[]'); }
  catch(e) { ziele = []; }
  if (!Array.isArray(ziele)) ziele = [];
  render();
}

function save() {
  localStorage.setItem('ziele', JSON.stringify(ziele));
}

function selectKat(el) {
  document.querySelectorAll('#katTags .tag').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('katCustom').value = '';
}

function getKat() {
  var c = document.getElementById('katCustom').value.trim();
  if (c) return c;
  var a = document.querySelector('#katTags .tag.active');
  return a ? a.textContent : 'Sonstiges';
}

function addZiel() {
  var titel = document.getElementById('titel').value.trim();
  var kat = getKat();
  var aktuell = parseFloat(document.getElementById('aktuell').value) || 0;
  var ziel = parseFloat(document.getElementById('ziel').value);
  var einheit = document.getElementById('einheit').value.trim();
  var deadline = document.getElementById('deadline').value;
  var notiz = document.getElementById('notiz').value.trim();
  if (!titel) { showToast('Bitte einen Titel eingeben!'); return; }
  if (!ziel || ziel <= 0) { showToast('Bitte einen Zielwert > 0 eingeben!'); return; }
  if (editId !== null) {
    var idx = ziele.findIndex(function(z){return z.id===editId;});
    if (idx !== -1) {
      var erstellt = ziele[idx].erstellt;
      ziele[idx] = {id:editId,titel:titel,kategorie:kat,aktuell:aktuell,ziel:ziel,einheit:einheit,deadline:deadline,notiz:notiz,erstellt:erstellt};
    }
    showToast('Ziel aktualisiert!');
    cancelEdit();
  } else {
    ziele.unshift({id:Date.now(),titel:titel,kategorie:kat,aktuell:aktuell,ziel:ziel,einheit:einheit,deadline:deadline,notiz:notiz,erstellt:Date.now()});
    showToast('Ziel gespeichert!');
    resetForm();
  }
  save(); render();
}

function editZiel(id) {
  var z = ziele.find(function(z){return z.id===id;});
  if (!z) return;
  editId = id;
  document.getElementById('titel').value = z.titel;
  document.getElementById('aktuell').value = z.aktuell;
  document.getElementById('ziel').value = z.ziel;
  document.getElementById('einheit').value = z.einheit || '';
  document.getElementById('deadline').value = z.deadline || '';
  document.getElementById('notiz').value = z.notiz || '';
  document.getElementById('katCustom').value = '';
  var matched = false;
  document.querySelectorAll('#katTags .tag').forEach(function(t){
    var on = t.textContent===z.kategorie;
    t.classList.toggle('active', on);
    if (on) matched = true;
  });
  if (!matched) document.getElementById('katCustom').value = z.kategorie;
  document.getElementById('formTitle').textContent = 'Ziel bearbeiten';
  document.getElementById('formCard').classList.add('edit-mode');
  document.getElementById('btnAdd').textContent = 'Speichern';
  document.getElementById('btnCancel').style.display = 'block';
  document.getElementById('formCard').scrollIntoView({behavior:'smooth'});
}

function cancelEdit() {
  editId = null;
  resetForm();
  document.getElementById('formTitle').textContent = 'Ziel hinzufügen';
  document.getElementById('formCard').classList.remove('edit-mode');
  document.getElementById('btnAdd').textContent = '+ Ziel hinzufügen';
  document.getElementById('btnCancel').style.display = 'none';
}

function resetForm() {
  document.getElementById('titel').value = '';
  document.getElementById('aktuell').value = '';
  document.getElementById('ziel').value = '';
  document.getElementById('einheit').value = '';
  document.getElementById('deadline').value = '';
  document.getElementById('notiz').value = '';
  document.getElementById('katCustom').value = '';
  document.querySelectorAll('#katTags .tag').forEach(function(t,i){t.classList.toggle('active',i===0);});
}

function deleteZiel(id) {
  if (!confirm('Ziel wirklich löschen?')) return;
  ziele = ziele.filter(function(z){return z.id!==id;});
  save(); render();
}

function bump(id, dir) {
  var z = ziele.find(function(z){return z.id===id;});
  if (!z) return;
  var step = z.ziel >= 20 ? Math.max(1, Math.round(z.ziel*0.05)) : 1;
  var neu = z.aktuell + dir*step;
  if (neu < 0) neu = 0;
  z.aktuell = Math.round(neu*100)/100;
  save(); render();
}

function setProgress(id) {
  var z = ziele.find(function(z){return z.id===id;});
  if (!z) return;
  var eingabe = prompt('Aktueller Stand' + (z.einheit ? ' (' + z.einheit + ')' : '') + ':', z.aktuell);
  if (eingabe === null) return;
  var val = parseFloat(String(eingabe).replace(',', '.'));
  if (isNaN(val) || val < 0) { showToast('Ungültiger Wert'); return; }
  z.aktuell = Math.round(val*100)/100;
  save(); render();
  showToast('Fortschritt aktualisiert!');
}

function fmt(n) {
  return Number(n).toLocaleString('de-DE',{maximumFractionDigits:2});
}

function pct(z) {
  if (!z.ziel) return 0;
  return Math.min(100, Math.max(0, (z.aktuell/z.ziel)*100));
}

function deadlineInfo(z) {
  if (!z.deadline) return {text:'Keine Frist', cls:''};
  var heute = new Date(); heute.setHours(0,0,0,0);
  var d = new Date(z.deadline); d.setHours(0,0,0,0);
  var diff = Math.round((d-heute)/86400000);
  var ds = d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  if (diff < 0) return {text:'⏰ ' + Math.abs(diff) + ' Tage überfällig · ' + ds, cls:'over'};
  if (diff === 0) return {text:'⏰ Heute fällig · ' + ds, cls:'soon'};
  if (diff <= 14) return {text:'⏰ noch ' + diff + ' Tage · ' + ds, cls:'soon'};
  return {text:'📅 bis ' + ds, cls:''};
}

function renderFilter() {
  var kats = {};
  ziele.forEach(function(z){ kats[z.kategorie] = (kats[z.kategorie]||0)+1; });
  var chips = [['alle','Alle']];
  Object.keys(kats).sort().forEach(function(k){ chips.push([k, k]); });
  if (aktivFilter !== 'alle' && !kats[aktivFilter]) aktivFilter = 'alle';
  var bar = document.getElementById('filterBar');
  bar.innerHTML = chips.map(function(c){
    var akt = c[0]===aktivFilter ? ' active' : '';
    var cnt = c[0]==='alle' ? ziele.length : kats[c[0]];
    return '<div class="filter-chip'+akt+'" onclick="setFilter('+JSON.stringify(c[0]).replace(/"/g,'&quot;')+')">'+esc(c[1])+' ('+cnt+')</div>';
  }).join('');
}

function setFilter(f) {
  aktivFilter = f;
  render();
}

function render() {
  var aktiv = 0, erreicht = 0, summe = 0;
  ziele.forEach(function(z){
    var p = pct(z);
    summe += p;
    if (p >= 100) erreicht++; else aktiv++;
  });
  var avg = ziele.length ? Math.round(summe/ziele.length) : 0;
  document.getElementById('statAktiv').textContent = aktiv;
  document.getElementById('statErreicht').textContent = erreicht;
  document.getElementById('statFortschritt').textContent = avg + '%';
  document.getElementById('headerMeta').textContent = ziele.length + (ziele.length===1 ? ' Ziel' : ' Ziele') + (erreicht ? ' · ' + erreicht + ' erreicht' : '');

  renderFilter();

  var liste = ziele.filter(function(z){ return aktivFilter==='alle' || z.kategorie===aktivFilter; });
  var el = document.getElementById('zielList');
  if (!liste.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">&#127919;</div>' + (ziele.length ? 'Keine Ziele in dieser Kategorie' : 'Noch keine Ziele – leg dein erstes an!') + '</div>';
    return;
  }
  el.innerHTML = liste.map(function(z){
    var p = pct(z);
    var done = p >= 100;
    var di = deadlineInfo(z);
    var einheit = z.einheit ? ' ' + esc(z.einheit) : '';
    var badge = done ? '<div class="done-badge">✓ Erreicht</div>' : '';
    var notiz = z.notiz ? '<div class="ziel-notiz">' + esc(z.notiz) + '</div>' : '';
    return '<div class="ziel-card' + (done?' done':'') + '">' +
      '<button class="btn-edit" onclick="editZiel('+z.id+')">&#9998;</button>' +
      '<button class="btn-delete" onclick="deleteZiel('+z.id+')">&#10005;</button>' +
      badge +
      '<div class="ziel-top"><div class="ziel-titel">' + esc(z.titel) + '</div><div class="ziel-kat">' + esc(z.kategorie) + '</div></div>' +
      notiz +
      '<div class="progress-wrap">' +
        '<div class="progress-info"><span class="progress-vals" onclick="setProgress('+z.id+')" style="cursor:pointer;">' + fmt(z.aktuell) + ' / ' + fmt(z.ziel) + einheit + '</span><span class="progress-pct">' + Math.round(p) + '%</span></div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + p + '%"></div></div>' +
      '</div>' +
      '<div class="ziel-foot"><span class="ziel-deadline ' + di.cls + '">' + di.text + '</span>' +
        '<span class="quick-btns"><button class="btn-quick minus" onclick="bump('+z.id+',-1)">&#8722;</button><button class="btn-quick" onclick="bump('+z.id+',1)">+</button></span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function exportJSON() {
  var blob = new Blob([JSON.stringify(ziele,null,2)],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='Ziele_Backup.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('Backup gespeichert!');
}

function importJSON(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error();
      var neu = 0;
      var ids = new Set(ziele.map(function(z){return z.id;}));
      data.forEach(function(z){if(!ids.has(z.id)){ziele.push(z);neu++;}});
      save(); render();
      showToast(neu+' Ziele importiert!');
    } catch(e) { showToast('Ungültige Datei!'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

// --- PWA: Installation & Offline ---
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstall').style.display = 'block';
});
window.addEventListener('appinstalled', function(){
  deferredPrompt = null;
  document.getElementById('btnInstall').style.display = 'none';
  showToast('App installiert!');
});
async function installApp() {
  if (!deferredPrompt) {
    showToast('Über das Browser-Menü „Zum Startbildschirm"');
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('btnInstall').style.display = 'none';
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('ziele-sw.js').catch(function(){});
  });
}

loadZiele();
</script>
